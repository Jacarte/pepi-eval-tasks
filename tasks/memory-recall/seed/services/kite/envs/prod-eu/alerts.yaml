# ledger-api production-eu alerts
service: ledger-api
environment: production-eu
log_retention_days: 45
metrics_retention_days: 45
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

# ledger-api development alerts
service: ledger-api
environment: development
log_retention_days: 60
metrics_retention_days: 7
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

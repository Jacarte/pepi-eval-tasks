# catalog-indexer sandbox alerts
service: catalog-indexer
environment: sandbox
log_retention_days: 30
metrics_retention_days: 45
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1600
    for: 10m
    severity: ticket

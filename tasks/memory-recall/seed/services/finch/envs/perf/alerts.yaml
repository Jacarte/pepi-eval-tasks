# catalog-indexer perf alerts
service: catalog-indexer
environment: perf
log_retention_days: 180
metrics_retention_days: 21
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

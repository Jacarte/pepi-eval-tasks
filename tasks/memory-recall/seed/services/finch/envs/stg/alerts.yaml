# catalog-indexer staging alerts
service: catalog-indexer
environment: staging
log_retention_days: 180
metrics_retention_days: 180
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

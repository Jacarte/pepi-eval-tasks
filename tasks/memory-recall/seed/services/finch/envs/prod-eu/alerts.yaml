# catalog-indexer production-eu alerts
service: catalog-indexer
environment: production-eu
log_retention_days: 90
metrics_retention_days: 7
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

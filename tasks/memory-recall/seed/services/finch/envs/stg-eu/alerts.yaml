# catalog-indexer staging-eu alerts
service: catalog-indexer
environment: staging-eu
log_retention_days: 14
metrics_retention_days: 90
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

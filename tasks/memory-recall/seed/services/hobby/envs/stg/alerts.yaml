# payouts-worker staging alerts
service: payouts-worker
environment: staging
log_retention_days: 21
metrics_retention_days: 45
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1400
    for: 10m
    severity: ticket

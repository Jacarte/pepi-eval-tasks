# payouts-worker staging-eu alerts
service: payouts-worker
environment: staging-eu
log_retention_days: 120
metrics_retention_days: 120
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

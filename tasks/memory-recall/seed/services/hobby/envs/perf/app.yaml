# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: ap-southeast-1
replicas: 6
log_level: warn
queue:
  name: hobby-perf
  batch_size: 50
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 500
upstreams:
  - checkout-worker
  - billing-legacy

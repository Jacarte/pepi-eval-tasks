# payouts-worker production settings; keys missing here come from ../../base.yaml
service: payouts-worker
environment: production
replicas: 4
log_level: info
queue:
  name: payouts-worker-production
  batch_size: 50
  visibility_timeout_s: 60
storage:
  bucket: acme-production-payouts-worker
  retention_days: 180
http:
  timeout_ms: 2000
upstreams:
  - orders-api

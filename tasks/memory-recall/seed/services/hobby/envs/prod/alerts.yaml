# payouts-worker production alerts
service: payouts-worker
environment: production
log_retention_days: 21
metrics_retention_days: 7
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

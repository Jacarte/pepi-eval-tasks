# payouts-worker development alerts
service: payouts-worker
environment: development
log_retention_days: 45
metrics_retention_days: 45
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

# payouts-worker production-eu alerts
service: payouts-worker
environment: production-eu
log_retention_days: 14
metrics_retention_days: 45
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

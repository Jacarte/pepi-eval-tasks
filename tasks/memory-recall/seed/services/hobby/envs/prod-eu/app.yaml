# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: us-west-1
replicas: 5
log_level: debug
queue:
  name: hobby-production-eu
  batch_size: 150
  visibility_timeout_s: 60
storage:
  include: ../../storage/burst.yaml
http:
  timeout_ms: 500
upstreams:
  - import-worker
  - gateway

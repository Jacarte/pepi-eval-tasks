# payouts-worker qa settings; keys missing here come from ../../base.yaml
service: payouts-worker
environment: qa
replicas: 5
log_level: debug
queue:
  name: payouts-worker-qa
  batch_size: 150
  visibility_timeout_s: 60
storage:
  bucket: acme-qa-payouts-worker
http:
  timeout_ms: 3000
upstreams:
  - sms-sender

# auth-api production-eu alerts
service: auth-api
environment: production-eu
log_retention_days: 21
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

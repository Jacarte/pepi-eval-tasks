# auth-api development alerts
service: auth-api
environment: development
log_retention_days: 365
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

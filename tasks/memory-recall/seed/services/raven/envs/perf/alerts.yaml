# notifications-api perf alerts
service: notifications-api
environment: perf
log_retention_days: 45
metrics_retention_days: 180
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1400
    for: 10m
    severity: ticket

# notifications-api sandbox alerts
service: notifications-api
environment: sandbox
log_retention_days: 60
metrics_retention_days: 30
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

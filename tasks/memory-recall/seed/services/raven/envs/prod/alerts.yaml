# notifications-api production alerts
service: notifications-api
environment: production
log_retention_days: 7
metrics_retention_days: 60
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

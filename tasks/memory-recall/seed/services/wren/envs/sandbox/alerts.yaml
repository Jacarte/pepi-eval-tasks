# billing-api sandbox alerts
service: billing-api
environment: sandbox
log_retention_days: 21
metrics_retention_days: 120
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

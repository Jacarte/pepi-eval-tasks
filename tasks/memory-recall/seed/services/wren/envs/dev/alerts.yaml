# billing-api development alerts
service: billing-api
environment: development
log_retention_days: 180
metrics_retention_days: 21
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

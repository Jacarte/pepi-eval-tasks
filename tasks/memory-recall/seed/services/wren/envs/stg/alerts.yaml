# billing-api staging alerts
service: billing-api
environment: staging
log_retention_days: 90
metrics_retention_days: 30
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

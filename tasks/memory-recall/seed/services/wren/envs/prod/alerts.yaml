# billing-api production alerts
service: billing-api
environment: production
log_retention_days: 60
metrics_retention_days: 120
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

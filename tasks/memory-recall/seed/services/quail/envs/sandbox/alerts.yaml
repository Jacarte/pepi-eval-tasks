# import-worker sandbox alerts
service: import-worker
environment: sandbox
log_retention_days: 30
metrics_retention_days: 7
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

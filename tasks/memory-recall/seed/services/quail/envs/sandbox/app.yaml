# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: ap-southeast-2
replicas: 4
log_level: warn
queue:
  name: quail-sandbox
  batch_size: 300
  visibility_timeout_s: 120
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 3000
upstreams:
  - audit-api

# import-worker development alerts
service: import-worker
environment: development
log_retention_days: 365
metrics_retention_days: 14
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

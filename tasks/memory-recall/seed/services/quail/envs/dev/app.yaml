# development settings; keys missing here come from ../../base.yaml
environment: development
region: ap-southeast-2
replicas: 5
log_level: warn
queue:
  name: quail-development
  batch_size: 300
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 1500
upstreams:
  - auth-api
  - search-api

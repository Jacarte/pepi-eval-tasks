# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: us-east-2
replicas: 3
log_level: info
queue:
  name: quail-staging
  batch_size: 100
  visibility_timeout_s: 90
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 3500
upstreams:
  - reports-api
  - users-api

# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: sa-east-1
replicas: 2
log_level: warn
queue:
  name: quail-perf
  batch_size: 200
  visibility_timeout_s: 60
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 1000
upstreams:
  - webhooks-api

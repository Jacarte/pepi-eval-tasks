# import-worker staging-eu alerts
service: import-worker
environment: staging-eu
log_retention_days: 21
metrics_retention_days: 30
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

# import-worker production-eu alerts
service: import-worker
environment: production-eu
log_retention_days: 90
metrics_retention_days: 365
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1900
    for: 10m
    severity: ticket

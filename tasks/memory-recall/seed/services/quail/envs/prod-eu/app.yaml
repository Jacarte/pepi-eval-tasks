# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: us-west-2
replicas: 1
log_level: debug
queue:
  name: quail-production-eu
  batch_size: 350
  visibility_timeout_s: 60
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 4000
upstreams:
  - webhooks-worker
  - email-sender

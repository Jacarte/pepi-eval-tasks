# import-worker production settings; keys missing here come from ../../base.yaml
service: import-worker
environment: production
replicas: 4
log_level: info
queue:
  name: import-worker-production
  batch_size: 200
  visibility_timeout_s: 120
storage:
  bucket: acme-production-import-worker
  retention_days: 7
http:
  timeout_ms: 2000
upstreams:
  - inventory-api
  - pricing-worker

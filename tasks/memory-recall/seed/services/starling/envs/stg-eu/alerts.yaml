# inventory-api staging-eu alerts
service: inventory-api
environment: staging-eu
log_retention_days: 45
metrics_retention_days: 30
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

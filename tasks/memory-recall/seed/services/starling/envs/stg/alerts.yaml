# inventory-api staging alerts
service: inventory-api
environment: staging
log_retention_days: 60
metrics_retention_days: 45
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

# inventory-api sandbox alerts
service: inventory-api
environment: sandbox
log_retention_days: 7
metrics_retention_days: 21
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

# inventory-api production-eu alerts
service: inventory-api
environment: production-eu
log_retention_days: 30
metrics_retention_days: 60
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

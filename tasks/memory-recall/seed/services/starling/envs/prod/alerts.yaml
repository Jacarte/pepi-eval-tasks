# inventory-api production alerts
service: inventory-api
environment: production
log_retention_days: 365
metrics_retention_days: 7
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

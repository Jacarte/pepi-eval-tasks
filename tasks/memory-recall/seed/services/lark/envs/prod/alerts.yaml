# search-api production alerts
service: search-api
environment: production
log_retention_days: 180
metrics_retention_days: 120
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

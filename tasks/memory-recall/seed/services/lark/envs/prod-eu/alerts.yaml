# search-api production-eu alerts
service: search-api
environment: production-eu
log_retention_days: 90
metrics_retention_days: 21
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

# search-api staging-eu alerts
service: search-api
environment: staging-eu
log_retention_days: 21
metrics_retention_days: 90
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

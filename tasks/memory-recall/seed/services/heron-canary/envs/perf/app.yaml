# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-west-1
replicas: 3
log_level: info
queue:
  name: heron-canary-perf
  batch_size: 400
  visibility_timeout_s: 90
storage:
  include: ../../storage/audit.yaml
http:
  timeout_ms: 1500
upstreams:
  - webhooks-worker
  - fraud-scorer

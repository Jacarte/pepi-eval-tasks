# staging settings; keys missing here come from ../../base.yaml
environment: staging
replicas: 1
log_level: warn
queue:
  name: pipit-staging
  batch_size: 350
  visibility_timeout_s: 90
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 2500
upstreams:
  - thumbnails-worker
  - reports-worker

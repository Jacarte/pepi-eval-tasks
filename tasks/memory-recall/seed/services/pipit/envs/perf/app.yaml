# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-west-1
replicas: 1
log_level: debug
queue:
  name: pipit-perf
  batch_size: 250
  visibility_timeout_s: 120
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 3000
upstreams:
  - checkout-worker
  - checkout-worker

# audit-worker production-eu settings; keys missing here come from ../../base.yaml
service: audit-worker
environment: production-eu
replicas: 6
log_level: warn
queue:
  name: audit-worker-production-eu
  batch_size: 50
  visibility_timeout_s: 90
storage:
  bucket: acme-production-eu-audit-worker
  retention_days: 45
http:
  timeout_ms: 1000
upstreams:
  - export-worker

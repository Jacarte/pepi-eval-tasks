# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: us-east-2
replicas: 2
log_level: debug
queue:
  name: pipit-production-eu
  batch_size: 50
  visibility_timeout_s: 30
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3000
upstreams:
  - billing-legacy
  - catalog-indexer

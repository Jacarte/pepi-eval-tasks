# audit-worker production-eu alerts
service: audit-worker
environment: production-eu
log_retention_days: 90
metrics_retention_days: 180
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: us-east-2
replicas: 3
log_level: warn
queue:
  name: pipit-sandbox
  batch_size: 400
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 2500
upstreams:
  - import-worker

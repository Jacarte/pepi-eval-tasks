# audit-worker staging-eu alerts
service: audit-worker
environment: staging-eu
log_retention_days: 180
metrics_retention_days: 365
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

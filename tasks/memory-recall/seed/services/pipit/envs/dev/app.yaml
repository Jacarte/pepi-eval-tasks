# development settings; keys missing here come from ../../base.yaml
environment: development
region: af-south-1
replicas: 4
log_level: warn
queue:
  name: pipit-development
  batch_size: 350
  visibility_timeout_s: 60
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3500
upstreams:
  - inventory-sync
  - catalog-indexer

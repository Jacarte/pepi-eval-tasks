# audit-worker production alerts
service: audit-worker
environment: production
log_retention_days: 45
metrics_retention_days: 30
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

# payouts-api staging-eu alerts
service: payouts-api
environment: staging-eu
log_retention_days: 21
metrics_retention_days: 45
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

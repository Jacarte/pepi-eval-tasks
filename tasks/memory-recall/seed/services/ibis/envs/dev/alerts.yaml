# payouts-api development alerts
service: payouts-api
environment: development
log_retention_days: 14
metrics_retention_days: 90
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

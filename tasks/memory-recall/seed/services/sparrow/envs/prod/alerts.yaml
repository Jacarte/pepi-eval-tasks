# inventory-sync production alerts
service: inventory-sync
environment: production
log_retention_days: 30
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

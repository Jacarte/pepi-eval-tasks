# inventory-sync staging alerts
service: inventory-sync
environment: staging
log_retention_days: 60
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

# inventory-sync development alerts
service: inventory-sync
environment: development
log_retention_days: 30
metrics_retention_days: 180
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

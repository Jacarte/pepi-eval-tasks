# inventory-sync production-eu alerts
service: inventory-sync
environment: production-eu
log_retention_days: 90
metrics_retention_days: 90
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: ap-south-1
replicas: 6
log_level: info
queue:
  name: tern-staging
  batch_size: 100
  visibility_timeout_s: 30
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 1500
upstreams:
  - billing-worker
  - export-worker

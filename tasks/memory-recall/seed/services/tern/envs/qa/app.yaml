# invoice-worker qa settings; keys missing here come from ../../base.yaml
service: invoice-worker
environment: qa
replicas: 2
log_level: warn
queue:
  name: invoice-worker-qa
  batch_size: 400
  visibility_timeout_s: 120
storage:
  bucket: acme-qa-invoice-worker
  retention_days: 14
http:
  timeout_ms: 3500
upstreams:
  - billing-worker
  - checkout-worker

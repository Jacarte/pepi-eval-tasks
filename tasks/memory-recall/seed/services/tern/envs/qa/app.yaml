# qa settings; keys missing here come from ../../base.yaml
environment: qa
region: ca-central-1
replicas: 5
log_level: debug
queue:
  name: tern-qa
  batch_size: 100
  visibility_timeout_s: 90
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 500
upstreams:
  - billing-worker
  - billing-scheduler
  - auth-worker

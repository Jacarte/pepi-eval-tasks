# development settings; keys missing here come from ../../base.yaml
environment: development
region: sa-east-1
replicas: 4
log_level: info
queue:
  name: tern-development
  batch_size: 200
  visibility_timeout_s: 90
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 1500
upstreams:
  - billing-worker
  - catalog-indexer

# development settings; keys missing here come from ../../base.yaml
environment: development
replicas: 2
log_level: debug
queue:
  name: tern-development
  batch_size: 150
  visibility_timeout_s: 30
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 1500
upstreams:
  - billing-worker
  - billing-api
  - inventory-api

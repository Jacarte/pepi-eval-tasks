# invoice-worker development alerts
service: invoice-worker
environment: development
log_retention_days: 30
metrics_retention_days: 45
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1400
    for: 10m
    severity: ticket

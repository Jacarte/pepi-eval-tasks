# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: us-west-1
replicas: 2
log_level: info
queue:
  name: tern-sandbox
  batch_size: 350
  visibility_timeout_s: 30
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 3500
upstreams:
  - billing-worker
  - export-worker

# invoice-worker sandbox alerts
service: invoice-worker
environment: sandbox
log_retention_days: 14
metrics_retention_days: 180
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

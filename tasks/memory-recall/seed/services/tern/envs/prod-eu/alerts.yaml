# invoice-worker production-eu alerts
service: invoice-worker
environment: production-eu
log_retention_days: 21
metrics_retention_days: 7
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

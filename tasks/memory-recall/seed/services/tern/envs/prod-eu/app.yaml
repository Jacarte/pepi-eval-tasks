# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: us-east-2
replicas: 1
log_level: debug
queue:
  name: tern-production-eu
  batch_size: 400
  visibility_timeout_s: 30
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 2500
upstreams:
  - billing-worker
  - auth-worker

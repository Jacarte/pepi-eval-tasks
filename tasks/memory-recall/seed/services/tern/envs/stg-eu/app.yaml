# invoice-worker staging-eu settings; keys missing here come from ../../base.yaml
service: invoice-worker
environment: staging-eu
replicas: 1
log_level: info
queue:
  name: invoice-worker-staging-eu
  batch_size: 300
  visibility_timeout_s: 60
storage:
  bucket: acme-staging-eu-invoice-worker
  retention_days: 120
http:
  timeout_ms: 1000
upstreams:
  - billing-worker
  - reports-worker

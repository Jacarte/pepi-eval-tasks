# invoice-worker staging-eu alerts
service: invoice-worker
environment: staging-eu
log_retention_days: 21
metrics_retention_days: 90
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1000
    for: 10m
    severity: ticket

# invoice-worker perf alerts
service: invoice-worker
environment: perf
log_retention_days: 7
metrics_retention_days: 365
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-west-2
replicas: 1
log_level: debug
queue:
  name: tern-perf
  batch_size: 50
  visibility_timeout_s: 30
storage:
  include: ../../storage/burst.yaml
http:
  timeout_ms: 2000
upstreams:
  - billing-worker
  - profiles-api
  - media-transcoder

# invoice-worker production alerts
service: invoice-worker
environment: production
log_retention_days: 120
metrics_retention_days: 14
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

# invoice-worker production settings; keys missing here come from ../../base.yaml
service: invoice-worker
environment: production
replicas: 5
log_level: info
queue:
  name: invoice-worker-production
  batch_size: 200
  visibility_timeout_s: 60
storage:
  bucket: acme-production-invoice-worker
http:
  timeout_ms: 1000
upstreams:
  - billing-worker
  - ledger-worker

# webhooks-api development alerts
service: webhooks-api
environment: development
log_retention_days: 365
metrics_retention_days: 21
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

# webhooks-api staging-eu alerts
service: webhooks-api
environment: staging-eu
log_retention_days: 60
metrics_retention_days: 120
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

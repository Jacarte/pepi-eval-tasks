# webhooks-api production alerts
service: webhooks-api
environment: production
log_retention_days: 7
metrics_retention_days: 30
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

# webhooks-api sandbox alerts
service: webhooks-api
environment: sandbox
log_retention_days: 60
metrics_retention_days: 120
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

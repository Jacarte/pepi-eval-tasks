# webhooks-api production-eu alerts
service: webhooks-api
environment: production-eu
log_retention_days: 90
metrics_retention_days: 60
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1500
    for: 10m
    severity: ticket

# audit-api development alerts
service: audit-api
environment: development
log_retention_days: 180
metrics_retention_days: 60
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

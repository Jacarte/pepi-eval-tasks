# audit-api production-eu alerts
service: audit-api
environment: production-eu
log_retention_days: 45
metrics_retention_days: 21
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

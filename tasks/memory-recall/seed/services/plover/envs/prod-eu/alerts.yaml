# billing-scheduler production-eu alerts
service: billing-scheduler
environment: production-eu
log_retention_days: 120
metrics_retention_days: 45
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

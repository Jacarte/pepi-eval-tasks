# billing-scheduler production alerts
service: billing-scheduler
environment: production
log_retention_days: 7
metrics_retention_days: 120
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1400
    for: 10m
    severity: ticket

# billing-scheduler staging alerts
service: billing-scheduler
environment: staging
log_retention_days: 60
metrics_retention_days: 7
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# billing-scheduler qa alerts
service: billing-scheduler
environment: qa
log_retention_days: 21
metrics_retention_days: 14
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

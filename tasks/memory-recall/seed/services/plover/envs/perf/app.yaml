# billing-scheduler perf settings; keys missing here come from ../../base.yaml
service: billing-scheduler
environment: perf
replicas: 3
log_level: info
storage:
  bucket: acme-perf-billing-scheduler
  retention_days: 120
http:
  timeout_ms: 3000
upstreams:
  - billing-worker
  - search-api
  - import-worker

# billing-scheduler perf alerts
service: billing-scheduler
environment: perf
log_retention_days: 7
metrics_retention_days: 90
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

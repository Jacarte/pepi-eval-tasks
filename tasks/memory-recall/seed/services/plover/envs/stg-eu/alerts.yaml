# billing-scheduler staging-eu alerts
service: billing-scheduler
environment: staging-eu
log_retention_days: 120
metrics_retention_days: 120
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1000
    for: 10m
    severity: ticket

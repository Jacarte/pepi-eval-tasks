# metrics-collector development alerts
service: metrics-collector
environment: development
log_retention_days: 30
metrics_retention_days: 7
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

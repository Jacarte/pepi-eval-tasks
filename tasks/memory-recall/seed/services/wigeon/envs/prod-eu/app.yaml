# metrics-collector production-eu settings; keys missing here come from ../../base.yaml
service: metrics-collector
environment: production-eu
replicas: 2
log_level: info
storage:
  bucket: acme-production-eu-metrics-collector
  retention_days: 7
http:
  timeout_ms: 2000
upstreams:
  - billing-api
  - thumbnails-worker

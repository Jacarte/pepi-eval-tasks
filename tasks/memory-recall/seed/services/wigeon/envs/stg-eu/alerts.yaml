# metrics-collector staging-eu alerts
service: metrics-collector
environment: staging-eu
log_retention_days: 90
metrics_retention_days: 365
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

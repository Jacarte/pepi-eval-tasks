# metrics-collector sandbox alerts
service: metrics-collector
environment: sandbox
log_retention_days: 120
metrics_retention_days: 7
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1600
    for: 10m
    severity: ticket

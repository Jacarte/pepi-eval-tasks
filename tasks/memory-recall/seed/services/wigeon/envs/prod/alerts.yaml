# metrics-collector production alerts
service: metrics-collector
environment: production
log_retention_days: 30
metrics_retention_days: 60
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

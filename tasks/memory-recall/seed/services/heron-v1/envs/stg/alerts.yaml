# Decommissioned: replaced by services/heron. Kept for reference, not deployed.
service: billing-worker
environment: staging
log_retention_days: 365
metrics_retention_days: 120
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

# Decommissioned: replaced by services/heron. Kept for reference, not deployed.
service: billing-worker
environment: production
log_retention_days: 120
metrics_retention_days: 7
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

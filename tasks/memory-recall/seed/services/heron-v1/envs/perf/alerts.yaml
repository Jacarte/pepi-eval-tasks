# Decommissioned: replaced by services/heron. Kept for reference, not deployed.
service: billing-worker
environment: perf
log_retention_days: 180
metrics_retention_days: 90
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

# perf settings; keys missing here come from ../../base.yaml
environment: perf
replicas: 6
log_level: info
queue:
  name: heron-v1-perf
  batch_size: 150
  visibility_timeout_s: 30
storage:
  include: ../../storage/low-cost.yaml
http:
  timeout_ms: 2000
upstreams:
  - notifications-api
  - webhooks-worker

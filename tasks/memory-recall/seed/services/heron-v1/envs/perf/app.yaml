# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: ap-southeast-1
replicas: 1
log_level: debug
queue:
  name: heron-v1-perf
  batch_size: 350
  visibility_timeout_s: 120
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 1000
upstreams:
  - admin-api

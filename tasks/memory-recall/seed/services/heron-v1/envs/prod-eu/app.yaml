# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: eu-west-3
replicas: 3
log_level: info
queue:
  name: heron-v1-production-eu
  batch_size: 400
  visibility_timeout_s: 60
storage:
  include: ../../storage/audit.yaml
http:
  timeout_ms: 1000
upstreams:
  - auth-worker
  - search-indexer

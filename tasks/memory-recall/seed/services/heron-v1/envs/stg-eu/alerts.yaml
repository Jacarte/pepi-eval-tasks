# Decommissioned: replaced by services/heron. Kept for reference, not deployed.
service: billing-worker
environment: staging-eu
log_retention_days: 365
metrics_retention_days: 45
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1000
    for: 10m
    severity: ticket

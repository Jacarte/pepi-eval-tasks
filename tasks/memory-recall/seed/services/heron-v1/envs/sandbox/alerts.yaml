# Decommissioned: replaced by services/heron. Kept for reference, not deployed.
service: billing-worker
environment: sandbox
log_retention_days: 30
metrics_retention_days: 60
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

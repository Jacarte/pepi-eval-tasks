# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
replicas: 3
log_level: warn
queue:
  name: heron-v1-sandbox
  batch_size: 50
  visibility_timeout_s: 120
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 500
upstreams:
  - checkout-worker
  - payouts-api

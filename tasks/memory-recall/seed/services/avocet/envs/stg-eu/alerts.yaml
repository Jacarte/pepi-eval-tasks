# thumbnails-worker staging-eu alerts
service: thumbnails-worker
environment: staging-eu
log_retention_days: 90
metrics_retention_days: 21
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1900
    for: 10m
    severity: ticket

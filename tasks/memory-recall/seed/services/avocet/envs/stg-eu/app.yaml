# staging-eu settings; keys missing here come from ../../base.yaml
environment: staging-eu
region: eu-central-1
replicas: 6
log_level: warn
queue:
  name: avocet-staging-eu
  batch_size: 200
  visibility_timeout_s: 30
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 2000
upstreams:
  - webhooks-worker

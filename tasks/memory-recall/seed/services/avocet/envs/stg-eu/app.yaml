# thumbnails-worker staging-eu settings; keys missing here come from ../../base.yaml
service: thumbnails-worker
environment: staging-eu
replicas: 5
log_level: debug
queue:
  name: thumbnails-worker-staging-eu
  batch_size: 150
  visibility_timeout_s: 60
storage:
  bucket: acme-staging-eu-thumbnails-worker
  retention_days: 21
http:
  timeout_ms: 1000
upstreams:
  - billing-api

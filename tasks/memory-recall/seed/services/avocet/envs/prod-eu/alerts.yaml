# thumbnails-worker production-eu alerts
service: thumbnails-worker
environment: production-eu
log_retention_days: 60
metrics_retention_days: 365
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

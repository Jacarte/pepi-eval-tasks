# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
replicas: 6
log_level: info
queue:
  name: avocet-sandbox
  batch_size: 350
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 2000
upstreams:
  - payouts-worker
  - reports-api

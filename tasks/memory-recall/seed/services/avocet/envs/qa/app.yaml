# qa settings; keys missing here come from ../../base.yaml
environment: qa
region: sa-east-1
replicas: 5
log_level: info
queue:
  name: avocet-qa
  batch_size: 400
  visibility_timeout_s: 60
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 2500
upstreams:
  - export-worker
  - billing-worker

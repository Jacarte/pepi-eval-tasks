# thumbnails-worker qa alerts
service: thumbnails-worker
environment: qa
log_retention_days: 180
metrics_retention_days: 30
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

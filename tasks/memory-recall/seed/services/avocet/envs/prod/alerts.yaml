# thumbnails-worker production alerts
service: thumbnails-worker
environment: production
log_retention_days: 60
metrics_retention_days: 365
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

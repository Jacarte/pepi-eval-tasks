# thumbnails-worker development alerts
service: thumbnails-worker
environment: development
log_retention_days: 45
metrics_retention_days: 60
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

replicas: 4
log_level: debug
queue:
  name: avocet-development
  batch_size: 100
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3500
upstreams:
  - pricing-worker
  - webhooks-worker

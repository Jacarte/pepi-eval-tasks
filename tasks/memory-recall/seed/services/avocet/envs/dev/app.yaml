# thumbnails-worker development settings; keys missing here come from ../../base.yaml
service: thumbnails-worker
environment: development
replicas: 5
log_level: warn
queue:
  name: thumbnails-worker-development
  batch_size: 50
  visibility_timeout_s: 120
storage:
  bucket: acme-development-thumbnails-worker
  retention_days: 7
http:
  timeout_ms: 2500
upstreams:
  - reports-api

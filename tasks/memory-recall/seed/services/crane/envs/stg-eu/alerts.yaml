# media-api staging-eu alerts
service: media-api
environment: staging-eu
log_retention_days: 365
metrics_retention_days: 14
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# media-api production-eu alerts
service: media-api
environment: production-eu
log_retention_days: 7
metrics_retention_days: 120
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

# admin-api development alerts
service: admin-api
environment: development
log_retention_days: 180
metrics_retention_days: 21
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

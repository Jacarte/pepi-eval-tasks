# admin-api staging-eu alerts
service: admin-api
environment: staging-eu
log_retention_days: 365
metrics_retention_days: 90
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

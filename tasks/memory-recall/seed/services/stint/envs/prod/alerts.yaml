# admin-api production alerts
service: admin-api
environment: production
log_retention_days: 30
metrics_retention_days: 45
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

# admin-api production-eu alerts
service: admin-api
environment: production-eu
log_retention_days: 7
metrics_retention_days: 30
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

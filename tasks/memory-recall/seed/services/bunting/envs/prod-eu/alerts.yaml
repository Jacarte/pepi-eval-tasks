# media-transcoder production-eu alerts
service: media-transcoder
environment: production-eu
log_retention_days: 365
metrics_retention_days: 7
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

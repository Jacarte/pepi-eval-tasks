# media-transcoder production alerts
service: media-transcoder
environment: production
log_retention_days: 60
metrics_retention_days: 60
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# media-transcoder development alerts
service: media-transcoder
environment: development
log_retention_days: 30
metrics_retention_days: 45
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

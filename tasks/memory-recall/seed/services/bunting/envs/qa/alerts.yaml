# media-transcoder qa alerts
service: media-transcoder
environment: qa
log_retention_days: 90
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1000
    for: 10m
    severity: ticket

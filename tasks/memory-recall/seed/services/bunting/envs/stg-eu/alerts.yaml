# media-transcoder staging-eu alerts
service: media-transcoder
environment: staging-eu
log_retention_days: 120
metrics_retention_days: 365
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: eu-central-1
replicas: 3
log_level: debug
queue:
  name: sandpiper-production-eu
  batch_size: 200
  visibility_timeout_s: 120
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 3000
upstreams:
  - catalog-indexer
  - notifications-api

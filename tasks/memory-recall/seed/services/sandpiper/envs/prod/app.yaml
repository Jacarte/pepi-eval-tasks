# webhooks-worker production settings; keys missing here come from ../../base.yaml
service: webhooks-worker
environment: production
replicas: 1
log_level: info
queue:
  name: webhooks-worker-production
  batch_size: 350
  visibility_timeout_s: 120
storage:
  bucket: acme-production-webhooks-worker
  retention_days: 21
http:
  timeout_ms: 500
upstreams:
  - notifications-api

# production settings; keys missing here come from ../../base.yaml
environment: production
region: us-east-1
replicas: 2
log_level: debug
queue:
  name: sandpiper-production
  batch_size: 300
  visibility_timeout_s: 30
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 1000
upstreams:
  - checkout-api
  - auth-api

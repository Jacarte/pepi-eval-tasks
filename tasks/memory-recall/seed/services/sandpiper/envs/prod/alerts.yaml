# webhooks-worker production alerts
service: webhooks-worker
environment: production
log_retention_days: 180
metrics_retention_days: 45
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

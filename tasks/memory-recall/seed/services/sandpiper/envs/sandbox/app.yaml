# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: ap-south-1
replicas: 3
log_level: debug
queue:
  name: sandpiper-sandbox
  batch_size: 400
  visibility_timeout_s: 120
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 1500
upstreams:
  - email-sender

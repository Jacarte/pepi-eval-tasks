# webhooks-worker qa alerts
service: webhooks-worker
environment: qa
log_retention_days: 180
metrics_retention_days: 30
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

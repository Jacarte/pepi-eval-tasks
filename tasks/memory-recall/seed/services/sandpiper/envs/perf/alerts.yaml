# webhooks-worker perf alerts
service: webhooks-worker
environment: perf
log_retention_days: 14
metrics_retention_days: 7
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# webhooks-worker staging-eu settings; keys missing here come from ../../base.yaml
service: webhooks-worker
environment: staging-eu
replicas: 2
log_level: warn
queue:
  name: webhooks-worker-staging-eu
  batch_size: 100
  visibility_timeout_s: 30
storage:
  bucket: acme-staging-eu-webhooks-worker
http:
  timeout_ms: 1500
upstreams:
  - catalog-indexer

# webhooks-worker staging-eu alerts
service: webhooks-worker
environment: staging-eu
log_retention_days: 30
metrics_retention_days: 365
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

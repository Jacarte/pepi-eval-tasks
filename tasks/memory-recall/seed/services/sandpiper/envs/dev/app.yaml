# development settings; keys missing here come from ../../base.yaml
environment: development
region: eu-south-1
replicas: 2
log_level: warn
queue:
  name: sandpiper-development
  batch_size: 50
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 3500
upstreams:
  - auth-worker
  - notifications-worker

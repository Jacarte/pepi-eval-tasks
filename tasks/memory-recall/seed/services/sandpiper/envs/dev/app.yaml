# development settings; keys missing here come from ../../base.yaml
environment: development
replicas: 2
log_level: warn
queue:
  name: sandpiper-development
  batch_size: 300
  visibility_timeout_s: 60
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 500
upstreams:
  - payouts-worker
  - billing-legacy

# orders-api production alerts
service: orders-api
environment: production
log_retention_days: 7
metrics_retention_days: 60
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

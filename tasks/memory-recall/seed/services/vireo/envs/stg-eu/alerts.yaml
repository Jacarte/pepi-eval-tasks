# orders-api staging-eu alerts
service: orders-api
environment: staging-eu
log_retention_days: 14
metrics_retention_days: 90
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

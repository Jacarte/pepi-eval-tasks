# orders-api sandbox alerts
service: orders-api
environment: sandbox
log_retention_days: 14
metrics_retention_days: 14
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1500
    for: 10m
    severity: ticket

# orders-api production-eu alerts
service: orders-api
environment: production-eu
log_retention_days: 45
metrics_retention_days: 60
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

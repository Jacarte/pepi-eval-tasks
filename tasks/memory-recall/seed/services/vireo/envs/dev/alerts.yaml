# orders-api development alerts
service: orders-api
environment: development
log_retention_days: 180
metrics_retention_days: 45
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

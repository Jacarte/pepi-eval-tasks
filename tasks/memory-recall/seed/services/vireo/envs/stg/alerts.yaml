# orders-api staging alerts
service: orders-api
environment: staging
log_retention_days: 30
metrics_retention_days: 180
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

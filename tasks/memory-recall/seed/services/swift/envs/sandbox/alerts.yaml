# checkout-api sandbox alerts
service: checkout-api
environment: sandbox
log_retention_days: 30
metrics_retention_days: 180
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

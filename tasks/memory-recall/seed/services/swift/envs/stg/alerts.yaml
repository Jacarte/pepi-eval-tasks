# checkout-api staging alerts
service: checkout-api
environment: staging
log_retention_days: 45
metrics_retention_days: 7
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

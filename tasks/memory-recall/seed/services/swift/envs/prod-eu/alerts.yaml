# checkout-api production-eu alerts
service: checkout-api
environment: production-eu
log_retention_days: 365
metrics_retention_days: 30
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

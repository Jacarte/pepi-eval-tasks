log_level: debug
queue:
  name: nuthatch-production-eu
  batch_size: 350
  visibility_timeout_s: 60
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 3000
upstreams:
  - auth-worker
  - payouts-worker

# sms-sender production-eu settings; keys missing here come from ../../base.yaml
service: sms-sender
environment: production-eu
replicas: 2
log_level: warn
queue:
  name: sms-sender-production-eu
  batch_size: 250
  visibility_timeout_s: 120
storage:
  bucket: acme-production-eu-sms-sender
  retention_days: 180
http:
  timeout_ms: 2000
upstreams:
  - orders-api

# sms-sender production-eu alerts
service: sms-sender
environment: production-eu
log_retention_days: 60
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

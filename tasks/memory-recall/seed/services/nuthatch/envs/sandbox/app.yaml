# sms-sender sandbox settings; keys missing here come from ../../base.yaml
service: sms-sender
environment: sandbox
replicas: 4
log_level: debug
queue:
  name: sms-sender-sandbox
  batch_size: 200
  visibility_timeout_s: 30
storage:
  bucket: acme-sandbox-sms-sender
  retention_days: 180
http:
  timeout_ms: 2000
upstreams:
  - import-worker

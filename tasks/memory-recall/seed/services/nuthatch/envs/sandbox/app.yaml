# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: eu-north-1
replicas: 1
log_level: warn
queue:
  name: nuthatch-sandbox
  batch_size: 100
  visibility_timeout_s: 30
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 500
upstreams:
  - admin-api

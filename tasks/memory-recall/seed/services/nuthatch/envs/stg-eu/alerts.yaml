# sms-sender staging-eu alerts
service: sms-sender
environment: staging-eu
log_retention_days: 14
metrics_retention_days: 60
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

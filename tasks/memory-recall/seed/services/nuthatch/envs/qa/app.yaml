# sms-sender qa settings; keys missing here come from ../../base.yaml
service: sms-sender
environment: qa
replicas: 6
log_level: debug
queue:
  name: sms-sender-qa
  batch_size: 400
  visibility_timeout_s: 30
storage:
  bucket: acme-qa-sms-sender
  retention_days: 7
http:
  timeout_ms: 500
upstreams:
  - import-worker

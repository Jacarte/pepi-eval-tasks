# qa settings; keys missing here come from ../../base.yaml
environment: qa
region: us-east-2
replicas: 4
log_level: warn
queue:
  name: nuthatch-qa
  batch_size: 150
  visibility_timeout_s: 30
storage:
  include: ../../storage/audit.yaml
http:
  timeout_ms: 3500
upstreams:
  - payouts-worker
  - inventory-sync

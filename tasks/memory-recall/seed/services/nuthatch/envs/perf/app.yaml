# sms-sender perf settings; keys missing here come from ../../base.yaml
service: sms-sender
environment: perf
replicas: 6
log_level: debug
queue:
  name: sms-sender-perf
  batch_size: 400
  visibility_timeout_s: 60
storage:
  bucket: acme-perf-sms-sender
  retention_days: 21
http:
  timeout_ms: 500
upstreams:
  - profiles-api

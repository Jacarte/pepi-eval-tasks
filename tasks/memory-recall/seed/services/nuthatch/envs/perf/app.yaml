# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: us-west-2
replicas: 3
log_level: info
queue:
  name: nuthatch-perf
  batch_size: 400
  visibility_timeout_s: 60
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3500
upstreams:
  - orders-worker

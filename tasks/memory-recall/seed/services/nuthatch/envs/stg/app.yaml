# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: us-east-2
replicas: 3
log_level: debug
queue:
  name: nuthatch-staging
  batch_size: 350
  visibility_timeout_s: 60
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 3000
upstreams:
  - auth-api
  - admin-api

# fraud-scorer development alerts
service: fraud-scorer
environment: development
log_retention_days: 60
metrics_retention_days: 7
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

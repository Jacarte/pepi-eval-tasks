# fraud-scorer staging alerts
service: fraud-scorer
environment: staging
log_retention_days: 120
metrics_retention_days: 7
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

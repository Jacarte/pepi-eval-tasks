# fraud-scorer production-eu alerts
service: fraud-scorer
environment: production-eu
log_retention_days: 60
metrics_retention_days: 30
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

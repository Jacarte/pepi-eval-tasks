# fraud-scorer production alerts
service: fraud-scorer
environment: production
log_retention_days: 30
metrics_retention_days: 90
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

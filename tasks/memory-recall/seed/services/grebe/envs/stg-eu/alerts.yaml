# fraud-scorer staging-eu alerts
service: fraud-scorer
environment: staging-eu
log_retention_days: 45
metrics_retention_days: 180
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

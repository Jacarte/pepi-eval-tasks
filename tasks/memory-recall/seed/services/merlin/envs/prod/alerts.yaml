# reports-api production alerts
service: reports-api
environment: production
log_retention_days: 21
metrics_retention_days: 180
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# reports-api sandbox alerts
service: reports-api
environment: sandbox
log_retention_days: 45
metrics_retention_days: 21
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

# reports-api production-eu alerts
service: reports-api
environment: production-eu
log_retention_days: 45
metrics_retention_days: 90
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1600
    for: 10m
    severity: ticket

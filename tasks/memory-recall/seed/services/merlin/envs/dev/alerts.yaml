# reports-api development alerts
service: reports-api
environment: development
log_retention_days: 60
metrics_retention_days: 45
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

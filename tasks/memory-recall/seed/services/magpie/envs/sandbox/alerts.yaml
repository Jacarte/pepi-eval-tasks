# search-indexer sandbox alerts
service: search-indexer
environment: sandbox
log_retention_days: 90
metrics_retention_days: 14
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

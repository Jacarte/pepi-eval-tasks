# search-indexer staging alerts
service: search-indexer
environment: staging
log_retention_days: 180
metrics_retention_days: 90
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1000
    for: 10m
    severity: ticket

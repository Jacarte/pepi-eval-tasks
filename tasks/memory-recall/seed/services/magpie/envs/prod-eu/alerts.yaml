# search-indexer production-eu alerts
service: search-indexer
environment: production-eu
log_retention_days: 180
metrics_retention_days: 7
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

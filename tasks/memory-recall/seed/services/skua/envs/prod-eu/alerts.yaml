# gateway production-eu alerts
service: gateway
environment: production-eu
log_retention_days: 120
metrics_retention_days: 21
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1000
    for: 10m
    severity: ticket

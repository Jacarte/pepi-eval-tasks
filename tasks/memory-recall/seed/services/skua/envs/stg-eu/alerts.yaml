# gateway staging-eu alerts
service: gateway
environment: staging-eu
log_retention_days: 365
metrics_retention_days: 30
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

# gateway development alerts
service: gateway
environment: development
log_retention_days: 14
metrics_retention_days: 180
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

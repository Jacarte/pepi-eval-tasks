# cart-api development alerts
service: cart-api
environment: development
log_retention_days: 21
metrics_retention_days: 14
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

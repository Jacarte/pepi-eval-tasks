# cart-api production-eu alerts
service: cart-api
environment: production-eu
log_retention_days: 365
metrics_retention_days: 45
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1600
    for: 10m
    severity: ticket

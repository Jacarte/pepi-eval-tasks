# cart-api production alerts
service: cart-api
environment: production
log_retention_days: 60
metrics_retention_days: 45
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

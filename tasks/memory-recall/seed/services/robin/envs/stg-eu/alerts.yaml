# cart-api staging-eu alerts
service: cart-api
environment: staging-eu
log_retention_days: 90
metrics_retention_days: 180
notify: team-identity
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

# orders-worker staging-eu alerts
service: orders-worker
environment: staging-eu
log_retention_days: 365
metrics_retention_days: 14
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

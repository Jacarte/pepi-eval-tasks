# orders-worker qa settings; keys missing here come from ../../base.yaml
service: orders-worker
environment: qa
replicas: 5
log_level: info
queue:
  name: orders-worker-qa
  batch_size: 100
  visibility_timeout_s: 60
storage:
  bucket: acme-qa-orders-worker
  retention_days: 60
http:
  timeout_ms: 1000
upstreams:
  - catalog-api

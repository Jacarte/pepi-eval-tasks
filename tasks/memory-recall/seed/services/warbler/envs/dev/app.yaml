region: ap-southeast-2
replicas: 4
log_level: info
queue:
  name: warbler-development
  batch_size: 100
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 500
upstreams:
  - admin-api
  - search-indexer

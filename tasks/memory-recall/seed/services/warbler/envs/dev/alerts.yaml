# orders-worker development alerts
service: orders-worker
environment: development
log_retention_days: 365
metrics_retention_days: 7
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

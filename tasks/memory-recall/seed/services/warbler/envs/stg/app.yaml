# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: eu-west-3
replicas: 4
log_level: info
queue:
  name: warbler-staging
  batch_size: 350
  visibility_timeout_s: 90
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 1000
upstreams:
  - notifications-worker
  - search-indexer

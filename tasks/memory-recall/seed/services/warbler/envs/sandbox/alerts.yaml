# orders-worker sandbox alerts
service: orders-worker
environment: sandbox
log_retention_days: 7
metrics_retention_days: 120
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1900
    for: 10m
    severity: ticket

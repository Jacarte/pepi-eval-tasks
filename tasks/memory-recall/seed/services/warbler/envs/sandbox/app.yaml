# orders-worker sandbox settings; keys missing here come from ../../base.yaml
service: orders-worker
environment: sandbox
replicas: 4
log_level: debug
queue:
  name: orders-worker-sandbox
  batch_size: 300
  visibility_timeout_s: 120
storage:
  bucket: acme-sandbox-orders-worker
http:
  timeout_ms: 3000
upstreams:
  - sms-sender
  - cart-api

# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: eu-west-1
replicas: 2
log_level: debug
queue:
  name: warbler-sandbox
  batch_size: 150
  visibility_timeout_s: 60
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 2000
upstreams:
  - search-indexer
  - email-sender

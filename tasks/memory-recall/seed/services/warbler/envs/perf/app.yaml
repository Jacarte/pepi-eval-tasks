# orders-worker perf settings; keys missing here come from ../../base.yaml
service: orders-worker
environment: perf
replicas: 2
log_level: debug
queue:
  name: orders-worker-perf
  batch_size: 350
  visibility_timeout_s: 120
storage:
  bucket: acme-perf-orders-worker
http:
  timeout_ms: 1500
upstreams:
  - scheduler

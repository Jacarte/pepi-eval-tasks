# orders-worker production alerts
service: orders-worker
environment: production
log_retention_days: 120
metrics_retention_days: 30
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: eu-north-1
replicas: 6
log_level: info
queue:
  name: warbler-production-eu
  batch_size: 50
  visibility_timeout_s: 30
storage:
  include: ../../storage/burst.yaml
http:
  timeout_ms: 2500
upstreams:
  - billing-worker
  - media-transcoder

# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: ca-central-1
replicas: 6
log_level: warn
queue:
  name: jay-staging
  batch_size: 250
  visibility_timeout_s: 120
storage:
  include: ../../storage/low-cost.yaml
http:
  timeout_ms: 2000
upstreams:
  - payouts-api
  - notifications-worker

# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: me-south-1
replicas: 2
log_level: info
queue:
  name: jay-sandbox
  batch_size: 200
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 2500
upstreams:
  - invoice-worker
  - invoice-worker

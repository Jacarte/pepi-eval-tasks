# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-west-1
replicas: 6
log_level: info
queue:
  name: jay-perf
  batch_size: 200
  visibility_timeout_s: 120
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 1000
upstreams:
  - payouts-worker

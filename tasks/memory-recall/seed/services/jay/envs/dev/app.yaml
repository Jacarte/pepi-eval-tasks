# ledger-worker development settings; keys missing here come from ../../base.yaml
service: ledger-worker
environment: development
replicas: 3
log_level: info
queue:
  name: ledger-worker-development
  batch_size: 300
  visibility_timeout_s: 120
storage:
  bucket: acme-development-ledger-worker
  retention_days: 45
http:
  timeout_ms: 3000
upstreams:
  - media-api
  - catalog-indexer

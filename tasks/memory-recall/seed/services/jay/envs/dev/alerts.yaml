# ledger-worker development alerts
service: ledger-worker
environment: development
log_retention_days: 14
metrics_retention_days: 45
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

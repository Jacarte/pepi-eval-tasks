# staging-eu settings; keys missing here come from ../../base.yaml
environment: staging-eu
region: sa-east-1
replicas: 5
log_level: debug
queue:
  name: jay-staging-eu
  batch_size: 100
  visibility_timeout_s: 60
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 1500
upstreams:
  - catalog-api
  - thumbnails-worker

# export-worker sandbox alerts
service: export-worker
environment: sandbox
log_retention_days: 21
metrics_retention_days: 45
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

# qa settings; keys missing here come from ../../base.yaml
environment: qa
region: ap-southeast-2
replicas: 4
log_level: debug
queue:
  name: puffin-qa
  batch_size: 350
  visibility_timeout_s: 90
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 1000
upstreams:
  - inventory-api
  - webhooks-api

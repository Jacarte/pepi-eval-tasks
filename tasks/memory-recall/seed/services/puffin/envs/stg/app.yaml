# staging settings; keys missing here come from ../../base.yaml
environment: staging
replicas: 3
log_level: debug
queue:
  name: puffin-staging
  batch_size: 300
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3500
upstreams:
  - auth-api
  - auth-worker

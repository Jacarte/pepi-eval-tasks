# export-worker staging settings; keys missing here come from ../../base.yaml
service: export-worker
environment: staging
replicas: 6
log_level: info
queue:
  name: export-worker-staging
  batch_size: 200
  visibility_timeout_s: 120
storage:
  bucket: acme-staging-export-worker
http:
  timeout_ms: 3500
upstreams:
  - inventory-api

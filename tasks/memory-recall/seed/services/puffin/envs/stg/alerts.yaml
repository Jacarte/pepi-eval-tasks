# export-worker staging alerts
service: export-worker
environment: staging
log_retention_days: 60
metrics_retention_days: 60
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

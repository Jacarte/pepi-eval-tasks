# development settings; keys missing here come from ../../base.yaml
environment: development
region: us-east-2
replicas: 1
log_level: debug
queue:
  name: puffin-development
  batch_size: 100
  visibility_timeout_s: 30
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 1500
upstreams:
  - import-worker
  - orders-worker

# export-worker development alerts
service: export-worker
environment: development
log_retention_days: 30
metrics_retention_days: 45
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

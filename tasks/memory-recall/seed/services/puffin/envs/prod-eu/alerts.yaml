# export-worker production-eu alerts
service: export-worker
environment: production-eu
log_retention_days: 21
metrics_retention_days: 14
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1500
    for: 10m
    severity: ticket

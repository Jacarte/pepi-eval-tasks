# profiles-api staging alerts
service: profiles-api
environment: staging
log_retention_days: 7
metrics_retention_days: 60
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

# profiles-api production-eu alerts
service: profiles-api
environment: production-eu
log_retention_days: 21
metrics_retention_days: 90
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1400
    for: 10m
    severity: ticket

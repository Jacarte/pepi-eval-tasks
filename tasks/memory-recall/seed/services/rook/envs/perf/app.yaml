# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-west-2
replicas: 6
log_level: debug
queue:
  name: rook-perf
  batch_size: 400
  visibility_timeout_s: 60
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 500
upstreams:
  - checkout-worker

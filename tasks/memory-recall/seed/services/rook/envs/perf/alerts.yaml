# pricing-worker perf alerts
service: pricing-worker
environment: perf
log_retention_days: 365
metrics_retention_days: 45
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

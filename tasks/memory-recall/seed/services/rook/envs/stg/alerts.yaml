# pricing-worker staging alerts
service: pricing-worker
environment: staging
log_retention_days: 14
metrics_retention_days: 45
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

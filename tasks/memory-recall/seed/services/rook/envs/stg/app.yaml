# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: ap-south-1
replicas: 2
log_level: info
queue:
  name: rook-staging
  batch_size: 100
  visibility_timeout_s: 60
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 3500
upstreams:
  - checkout-api
  - reports-worker

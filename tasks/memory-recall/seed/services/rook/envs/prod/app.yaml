# pricing-worker production settings; keys missing here come from ../../base.yaml
service: pricing-worker
environment: production
replicas: 4
log_level: info
queue:
  name: pricing-worker-production
  batch_size: 100
  visibility_timeout_s: 60
storage:
  bucket: acme-production-pricing-worker
  retention_days: 120
http:
  timeout_ms: 500
upstreams:
  - catalog-indexer

# pricing-worker production alerts
service: pricing-worker
environment: production
log_retention_days: 180
metrics_retention_days: 30
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

# pricing-worker staging-eu alerts
service: pricing-worker
environment: staging-eu
log_retention_days: 120
metrics_retention_days: 365
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

# pricing-worker development alerts
service: pricing-worker
environment: development
log_retention_days: 7
metrics_retention_days: 90
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

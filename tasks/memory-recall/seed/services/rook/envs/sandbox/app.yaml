# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: eu-west-2
replicas: 1
log_level: warn
queue:
  name: rook-sandbox
  batch_size: 150
  visibility_timeout_s: 90
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 2500
upstreams:
  - audit-api

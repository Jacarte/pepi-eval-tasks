# pricing-worker sandbox settings; keys missing here come from ../../base.yaml
service: pricing-worker
environment: sandbox
replicas: 2
log_level: debug
queue:
  name: pricing-worker-sandbox
  batch_size: 200
  visibility_timeout_s: 30
storage:
  bucket: acme-sandbox-pricing-worker
  retention_days: 60
http:
  timeout_ms: 2500
upstreams:
  - auth-worker
  - risk-api

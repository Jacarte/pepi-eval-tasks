# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
replicas: 6
log_level: debug
queue:
  name: rook-sandbox
  batch_size: 150
  visibility_timeout_s: 60
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 4000
upstreams:
  - audit-worker
  - pricing-api

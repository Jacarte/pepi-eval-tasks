# pricing-worker sandbox alerts
service: pricing-worker
environment: sandbox
log_retention_days: 7
metrics_retention_days: 120
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

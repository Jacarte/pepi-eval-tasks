# pricing-worker qa settings; keys missing here come from ../../base.yaml
service: pricing-worker
environment: qa
replicas: 6
log_level: warn
queue:
  name: pricing-worker-qa
  batch_size: 350
  visibility_timeout_s: 90
storage:
  bucket: acme-qa-pricing-worker
  retention_days: 90
http:
  timeout_ms: 3000
upstreams:
  - checkout-worker

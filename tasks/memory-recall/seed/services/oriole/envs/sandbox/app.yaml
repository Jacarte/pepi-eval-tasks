# email-sender sandbox settings; keys missing here come from ../../base.yaml
service: email-sender
environment: sandbox
replicas: 6
log_level: debug
queue:
  name: email-sender-sandbox
  batch_size: 350
  visibility_timeout_s: 30
storage:
  bucket: acme-sandbox-email-sender
  retention_days: 60
http:
  timeout_ms: 3000
upstreams:
  - cart-api

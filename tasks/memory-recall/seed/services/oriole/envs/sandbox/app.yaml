# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: eu-west-3
replicas: 4
log_level: info
queue:
  name: oriole-sandbox
  batch_size: 400
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 2500
upstreams:
  - ledger-api
  - checkout-api

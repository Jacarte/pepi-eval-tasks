# email-sender staging settings; keys missing here come from ../../base.yaml
service: email-sender
environment: staging
replicas: 5
log_level: info
queue:
  name: email-sender-staging
  batch_size: 350
  visibility_timeout_s: 90
storage:
  bucket: acme-staging-email-sender
  retention_days: 90
http:
  timeout_ms: 500
upstreams:
  - checkout-api
  - invoice-worker

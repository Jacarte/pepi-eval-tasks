# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: sa-east-1
replicas: 3
log_level: debug
queue:
  name: oriole-staging
  batch_size: 50
  visibility_timeout_s: 90
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 4000
upstreams:
  - ledger-worker
  - audit-api

# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-west-3
replicas: 1
log_level: debug
queue:
  name: oriole-perf
  batch_size: 50
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 1500
upstreams:
  - webhooks-worker
  - search-indexer

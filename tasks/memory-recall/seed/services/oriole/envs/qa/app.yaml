# email-sender qa settings; keys missing here come from ../../base.yaml
service: email-sender
environment: qa
replicas: 1
log_level: info
queue:
  name: email-sender-qa
  batch_size: 250
  visibility_timeout_s: 90
storage:
  bucket: acme-qa-email-sender
  retention_days: 30
http:
  timeout_ms: 2000
upstreams:
  - billing-worker

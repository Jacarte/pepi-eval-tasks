replicas: 3
log_level: debug
queue:
  name: oriole-staging-eu
  batch_size: 250
  visibility_timeout_s: 60
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 3000
upstreams:
  - audit-api

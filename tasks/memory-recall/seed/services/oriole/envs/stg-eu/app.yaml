# email-sender staging-eu settings; keys missing here come from ../../base.yaml
service: email-sender
environment: staging-eu
replicas: 3
log_level: info
queue:
  name: email-sender-staging-eu
  batch_size: 250
  visibility_timeout_s: 120
storage:
  bucket: acme-staging-eu-email-sender
  retention_days: 21
http:
  timeout_ms: 4000
upstreams:
  - catalog-indexer
  - billing-api

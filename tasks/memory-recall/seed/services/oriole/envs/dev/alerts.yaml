# email-sender development alerts
service: email-sender
environment: development
log_retention_days: 180
metrics_retention_days: 7
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

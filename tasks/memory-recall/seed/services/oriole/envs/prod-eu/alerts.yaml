# email-sender production-eu alerts
service: email-sender
environment: production-eu
log_retention_days: 7
metrics_retention_days: 180
notify: team-data
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1800
    for: 10m
    severity: ticket

# pricing-api staging alerts
service: pricing-api
environment: staging
log_retention_days: 365
metrics_retention_days: 45
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

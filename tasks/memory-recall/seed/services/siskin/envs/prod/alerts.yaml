# pricing-api production alerts
service: pricing-api
environment: production
log_retention_days: 45
metrics_retention_days: 30
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

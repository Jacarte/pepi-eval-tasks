# pricing-api production-eu alerts
service: pricing-api
environment: production-eu
log_retention_days: 14
metrics_retention_days: 7
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

# pricing-api staging-eu alerts
service: pricing-api
environment: staging-eu
log_retention_days: 21
metrics_retention_days: 90
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket

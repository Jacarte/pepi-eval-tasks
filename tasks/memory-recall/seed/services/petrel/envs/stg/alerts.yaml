# notifications-worker staging alerts
service: notifications-worker
environment: staging
log_retention_days: 7
metrics_retention_days: 21
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1500
    for: 10m
    severity: ticket

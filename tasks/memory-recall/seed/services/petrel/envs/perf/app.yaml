# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: ap-southeast-2
replicas: 2
log_level: info
queue:
  name: petrel-perf
  batch_size: 100
  visibility_timeout_s: 60
storage:
  include: ../../storage/compliance.yaml
http:
  timeout_ms: 3000
upstreams:
  - gateway

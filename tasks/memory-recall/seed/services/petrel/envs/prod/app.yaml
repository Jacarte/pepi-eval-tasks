region: eu-west-2
replicas: 1
log_level: info
queue:
  name: petrel-production
  batch_size: 350
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 2500
upstreams:
  - billing-legacy
  - auth-api

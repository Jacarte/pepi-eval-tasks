# notifications-worker production alerts
service: notifications-worker
environment: production
log_retention_days: 45
metrics_retention_days: 7
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 700
    for: 10m
    severity: ticket

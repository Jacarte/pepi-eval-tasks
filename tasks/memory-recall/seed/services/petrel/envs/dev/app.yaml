# development settings; keys missing here come from ../../base.yaml
environment: development
region: eu-central-1
replicas: 5
log_level: debug
queue:
  name: petrel-development
  batch_size: 150
  visibility_timeout_s: 60
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 2500
upstreams:
  - email-sender
  - reports-worker

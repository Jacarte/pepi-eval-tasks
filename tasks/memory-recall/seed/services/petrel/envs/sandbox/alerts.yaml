# notifications-worker sandbox alerts
service: notifications-worker
environment: sandbox
log_retention_days: 365
metrics_retention_days: 21
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

# notifications-worker production-eu alerts
service: notifications-worker
environment: production-eu
log_retention_days: 180
metrics_retention_days: 21
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1500
    for: 10m
    severity: ticket

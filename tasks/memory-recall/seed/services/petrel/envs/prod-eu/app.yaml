# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: eu-north-1
replicas: 2
log_level: debug
queue:
  name: petrel-production-eu
  batch_size: 300
  visibility_timeout_s: 90
storage:
  include: ../../storage/burst.yaml
http:
  timeout_ms: 2500
upstreams:
  - gateway
  - inventory-api

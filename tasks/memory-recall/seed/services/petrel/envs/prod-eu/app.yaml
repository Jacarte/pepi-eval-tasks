# notifications-worker production-eu settings; keys missing here come from ../../base.yaml
service: notifications-worker
environment: production-eu
replicas: 3
log_level: info
queue:
  name: notifications-worker-production-eu
  batch_size: 250
  visibility_timeout_s: 30
storage:
  bucket: acme-production-eu-notifications-worker
  retention_days: 120
http:
  timeout_ms: 2500
upstreams:
  - email-sender
  - scheduler

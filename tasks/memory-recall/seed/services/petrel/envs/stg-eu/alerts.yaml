# notifications-worker staging-eu alerts
service: notifications-worker
environment: staging-eu
log_retention_days: 45
metrics_retention_days: 90
notify: team-growth
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

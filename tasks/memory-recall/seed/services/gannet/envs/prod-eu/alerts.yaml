# risk-api production-eu alerts
service: risk-api
environment: production-eu
log_retention_days: 7
metrics_retention_days: 45
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 500
    for: 10m
    severity: ticket

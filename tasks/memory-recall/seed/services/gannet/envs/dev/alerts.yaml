# risk-api development alerts
service: risk-api
environment: development
log_retention_days: 7
metrics_retention_days: 45
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

# catalog-api staging alerts
service: catalog-api
environment: staging
log_retention_days: 180
metrics_retention_days: 7
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

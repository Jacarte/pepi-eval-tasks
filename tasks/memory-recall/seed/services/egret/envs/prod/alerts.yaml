# catalog-api production alerts
service: catalog-api
environment: production
log_retention_days: 365
metrics_retention_days: 7
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

# catalog-api development alerts
service: catalog-api
environment: development
log_retention_days: 120
metrics_retention_days: 180
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

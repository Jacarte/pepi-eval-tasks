# catalog-api sandbox alerts
service: catalog-api
environment: sandbox
log_retention_days: 30
metrics_retention_days: 60
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1500
    for: 10m
    severity: ticket

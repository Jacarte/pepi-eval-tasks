# reports-worker staging settings; keys missing here come from ../../base.yaml
service: reports-worker
environment: staging
replicas: 1
log_level: warn
queue:
  name: reports-worker-staging
  batch_size: 300
  visibility_timeout_s: 30
storage:
  bucket: acme-staging-reports-worker
  retention_days: 7
http:
  timeout_ms: 3000
upstreams:
  - payouts-api

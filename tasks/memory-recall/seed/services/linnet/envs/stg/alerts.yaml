# reports-worker staging alerts
service: reports-worker
environment: staging
log_retention_days: 7
metrics_retention_days: 365
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.01
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2100
    for: 10m
    severity: ticket

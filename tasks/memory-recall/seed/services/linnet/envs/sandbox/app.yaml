# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
replicas: 3
log_level: warn
queue:
  name: linnet-sandbox
  batch_size: 250
  visibility_timeout_s: 90
storage:
  include: ../../storage/audit.yaml
http:
  timeout_ms: 1500
upstreams:
  - admin-api
  - inventory-sync

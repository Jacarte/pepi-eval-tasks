# reports-worker sandbox alerts
service: reports-worker
environment: sandbox
log_retention_days: 21
metrics_retention_days: 45
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

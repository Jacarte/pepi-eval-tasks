# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: eu-north-1
replicas: 6
log_level: info
queue:
  name: linnet-production-eu
  batch_size: 100
  visibility_timeout_s: 120
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 3500
upstreams:
  - webhooks-api
  - cart-api

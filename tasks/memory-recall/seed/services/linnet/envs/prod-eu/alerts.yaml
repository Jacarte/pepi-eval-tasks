# reports-worker production-eu alerts
service: reports-worker
environment: production-eu
log_retention_days: 60
metrics_retention_days: 21
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1400
    for: 10m
    severity: ticket

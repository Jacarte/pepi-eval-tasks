# perf settings; keys missing here come from ../../base.yaml
environment: perf
replicas: 6
log_level: debug
queue:
  name: linnet-perf
  batch_size: 150
  visibility_timeout_s: 60
storage:
  include: ../../storage/low-cost.yaml
http:
  timeout_ms: 3500
upstreams:
  - reports-api
  - notifications-api

# reports-worker development alerts
service: reports-worker
environment: development
log_retention_days: 365
metrics_retention_days: 365
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

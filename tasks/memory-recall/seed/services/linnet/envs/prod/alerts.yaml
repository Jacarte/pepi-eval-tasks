# reports-worker production alerts
service: reports-worker
environment: production
log_retention_days: 14
metrics_retention_days: 120
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 300
    for: 10m
    severity: ticket

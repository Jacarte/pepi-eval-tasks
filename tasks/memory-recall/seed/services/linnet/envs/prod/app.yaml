# reports-worker production settings; keys missing here come from ../../base.yaml
service: reports-worker
environment: production
replicas: 5
log_level: info
queue:
  name: reports-worker-production
  batch_size: 400
  visibility_timeout_s: 120
storage:
  bucket: acme-production-reports-worker
  retention_days: 14
http:
  timeout_ms: 4000
upstreams:
  - profiles-api

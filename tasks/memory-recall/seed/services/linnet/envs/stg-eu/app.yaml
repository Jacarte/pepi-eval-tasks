# staging-eu settings; keys missing here come from ../../base.yaml
environment: staging-eu
region: sa-east-1
replicas: 2
log_level: warn
queue:
  name: linnet-staging-eu
  batch_size: 400
  visibility_timeout_s: 120
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3500
upstreams:
  - pricing-api
  - webhooks-worker

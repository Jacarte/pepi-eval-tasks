# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
replicas: 6
log_level: warn
queue:
  name: heron-sandbox
  batch_size: 350
  visibility_timeout_s: 120
storage:
  include: ../../storage/low-cost.yaml
http:
  timeout_ms: 3500
upstreams:
  - profiles-api
  - billing-legacy

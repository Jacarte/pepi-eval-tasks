# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: ca-central-1
replicas: 2
log_level: debug
queue:
  name: heron-sandbox
  batch_size: 150
  visibility_timeout_s: 30
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 1500
upstreams:
  - reports-worker

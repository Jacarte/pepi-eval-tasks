# billing-worker qa settings; keys missing here come from ../../base.yaml
service: billing-worker
environment: qa
replicas: 6
log_level: warn
queue:
  name: billing-worker-qa
  batch_size: 300
  visibility_timeout_s: 120
storage:
  bucket: acme-qa-billing-worker
  retention_days: 14
http:
  timeout_ms: 4000
upstreams:
  - reports-api
  - invoice-worker

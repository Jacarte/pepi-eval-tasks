# staging-eu settings; keys missing here come from ../../base.yaml
environment: staging-eu
replicas: 1
log_level: warn
queue:
  name: heron-staging-eu
  batch_size: 150
  visibility_timeout_s: 60
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 500
upstreams:
  - media-api
  - webhooks-worker

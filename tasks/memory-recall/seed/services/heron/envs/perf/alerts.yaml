# billing-worker perf alerts
service: billing-worker
environment: perf
log_retention_days: 45
metrics_retention_days: 14
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.05
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1200
    for: 10m
    severity: ticket

# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: ca-central-1
replicas: 1
log_level: debug
queue:
  name: heron-perf
  batch_size: 300
  visibility_timeout_s: 60
storage:
  include: ../../storage/compliance.yaml
http:
  timeout_ms: 4000
upstreams:
  - admin-api
  - billing-api

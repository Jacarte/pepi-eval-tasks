# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: eu-central-1
replicas: 6
log_level: warn
queue:
  name: heron-production-eu
  batch_size: 250
  visibility_timeout_s: 90
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 1500
upstreams:
  - email-sender
  - checkout-api

# billing-worker production-eu alerts
service: billing-worker
environment: production-eu
log_retention_days: 14
metrics_retention_days: 120
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# billing-worker development alerts
service: billing-worker
environment: development
log_retention_days: 180
metrics_retention_days: 21
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

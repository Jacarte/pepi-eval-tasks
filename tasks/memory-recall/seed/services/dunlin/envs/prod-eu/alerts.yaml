# users-api production-eu alerts
service: users-api
environment: production-eu
log_retention_days: 120
metrics_retention_days: 90
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

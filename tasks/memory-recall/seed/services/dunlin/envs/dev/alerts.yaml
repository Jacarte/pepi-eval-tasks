# users-api development alerts
service: users-api
environment: development
log_retention_days: 30
metrics_retention_days: 90
notify: team-platform
alerts:
  - name: error-rate
    threshold: 0.07
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 800
    for: 10m
    severity: ticket

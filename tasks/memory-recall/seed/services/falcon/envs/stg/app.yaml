# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: us-east-2
replicas: 4
log_level: warn
queue:
  name: falcon-staging
  batch_size: 100
  visibility_timeout_s: 120
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 3000
upstreams:
  - profiles-api
  - invoice-worker

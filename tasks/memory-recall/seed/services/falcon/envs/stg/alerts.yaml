# auth-worker staging alerts
service: auth-worker
environment: staging
log_retention_days: 60
metrics_retention_days: 21
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1100
    for: 10m
    severity: ticket

# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
region: ap-southeast-1
replicas: 1
log_level: info
queue:
  name: falcon-production-eu
  batch_size: 400
  visibility_timeout_s: 30
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 2000
upstreams:
  - payouts-worker
  - gateway

# auth-worker production-eu alerts
service: auth-worker
environment: production-eu
log_retention_days: 45
metrics_retention_days: 14
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.06
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 900
    for: 10m
    severity: ticket

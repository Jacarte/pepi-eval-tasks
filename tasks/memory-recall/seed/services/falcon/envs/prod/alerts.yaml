# auth-worker production alerts
service: auth-worker
environment: production
log_retention_days: 45
metrics_retention_days: 14
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.04
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 2000
    for: 10m
    severity: ticket

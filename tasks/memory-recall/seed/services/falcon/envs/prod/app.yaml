# auth-worker production settings; keys missing here come from ../../base.yaml
service: auth-worker
environment: production
replicas: 5
log_level: debug
queue:
  name: auth-worker-production
  batch_size: 100
  visibility_timeout_s: 30
storage:
  bucket: acme-production-auth-worker
  retention_days: 120
http:
  timeout_ms: 2500
upstreams:
  - inventory-sync

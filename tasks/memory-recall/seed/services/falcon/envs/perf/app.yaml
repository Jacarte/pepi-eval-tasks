# auth-worker perf settings; keys missing here come from ../../base.yaml
service: auth-worker
environment: perf
replicas: 1
log_level: info
queue:
  name: auth-worker-perf
  batch_size: 350
  visibility_timeout_s: 30
storage:
  bucket: acme-perf-auth-worker
  retention_days: 90
http:
  timeout_ms: 1500
upstreams:
  - thumbnails-worker

# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: us-east-2
replicas: 4
log_level: info
queue:
  name: falcon-perf
  batch_size: 50
  visibility_timeout_s: 90
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 1500
upstreams:
  - reports-api
  - payouts-worker

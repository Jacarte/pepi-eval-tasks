# auth-worker development alerts
service: auth-worker
environment: development
log_retention_days: 45
metrics_retention_days: 60
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.03
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1700
    for: 10m
    severity: ticket

# development settings; keys missing here come from ../../base.yaml
environment: development
region: us-east-1
replicas: 3
log_level: info
queue:
  name: falcon-development
  batch_size: 200
  visibility_timeout_s: 30
storage:
  include: ../../storage/shared.yaml
http:
  timeout_ms: 2500
upstreams:
  - media-transcoder
  - webhooks-api

# staging-eu settings; keys missing here come from ../../base.yaml
environment: staging-eu
region: me-south-1
replicas: 2
log_level: warn
queue:
  name: falcon-staging-eu
  batch_size: 150
  visibility_timeout_s: 90
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 3000
upstreams:
  - media-transcoder
  - invoice-worker

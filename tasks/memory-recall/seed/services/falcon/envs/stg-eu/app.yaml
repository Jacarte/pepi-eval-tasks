# auth-worker staging-eu settings; keys missing here come from ../../base.yaml
service: auth-worker
environment: staging-eu
replicas: 2
log_level: info
queue:
  name: auth-worker-staging-eu
  batch_size: 300
  visibility_timeout_s: 120
storage:
  bucket: acme-staging-eu-auth-worker
http:
  timeout_ms: 1000
upstreams:
  - checkout-api
  - billing-api

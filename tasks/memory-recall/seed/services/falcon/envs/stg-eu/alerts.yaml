# auth-worker staging-eu alerts
service: auth-worker
environment: staging-eu
log_retention_days: 180
metrics_retention_days: 14
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.02
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1300
    for: 10m
    severity: ticket

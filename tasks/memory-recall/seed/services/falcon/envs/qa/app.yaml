# auth-worker qa settings; keys missing here come from ../../base.yaml
service: auth-worker
environment: qa
replicas: 3
log_level: warn
queue:
  name: auth-worker-qa
  batch_size: 250
  visibility_timeout_s: 60
storage:
  bucket: acme-qa-auth-worker
  retention_days: 180
http:
  timeout_ms: 2500
upstreams:
  - catalog-indexer
  - audit-api

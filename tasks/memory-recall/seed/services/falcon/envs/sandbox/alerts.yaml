# auth-worker sandbox alerts
service: auth-worker
environment: sandbox
log_retention_days: 120
metrics_retention_days: 120
notify: team-commerce
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 1900
    for: 10m
    severity: ticket

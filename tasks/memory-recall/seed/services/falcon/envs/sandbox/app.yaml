# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: eu-west-1
replicas: 1
log_level: warn
queue:
  name: falcon-sandbox
  batch_size: 300
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 2500
upstreams:
  - users-api
  - gateway

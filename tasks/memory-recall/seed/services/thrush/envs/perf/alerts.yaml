# checkout-worker perf alerts
service: checkout-worker
environment: perf
log_retention_days: 365
metrics_retention_days: 180
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 200
    for: 10m
    severity: ticket

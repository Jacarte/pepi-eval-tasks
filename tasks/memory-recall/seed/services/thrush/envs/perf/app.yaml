# perf settings; keys missing here come from ../../base.yaml
environment: perf
region: eu-south-1
replicas: 6
log_level: info
queue:
  name: thrush-perf
  batch_size: 200
  visibility_timeout_s: 120
storage:
  include: ../../storage/standard.yaml
http:
  timeout_ms: 1500
upstreams:
  - catalog-indexer

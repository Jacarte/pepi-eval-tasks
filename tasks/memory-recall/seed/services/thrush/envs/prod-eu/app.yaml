# production-eu settings; keys missing here come from ../../base.yaml
environment: production-eu
replicas: 1
log_level: warn
queue:
  name: thrush-production-eu
  batch_size: 100
  visibility_timeout_s: 90
storage:
  include: ../../storage/standard-eu.yaml
http:
  timeout_ms: 2000
upstreams:
  - media-api
  - sms-sender

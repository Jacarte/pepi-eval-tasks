# sandbox settings; keys missing here come from ../../base.yaml
environment: sandbox
region: eu-west-1
replicas: 4
log_level: debug
queue:
  name: thrush-sandbox
  batch_size: 200
  visibility_timeout_s: 60
storage:
  include: ../../storage/audit.yaml
http:
  timeout_ms: 4000
upstreams:
  - pricing-worker
  - reports-worker

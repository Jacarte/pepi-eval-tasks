# staging-eu settings; keys missing here come from ../../base.yaml
environment: staging-eu
region: eu-west-3
replicas: 3
log_level: warn
queue:
  name: thrush-staging-eu
  batch_size: 200
  visibility_timeout_s: 30
storage:
  include: ../../storage/archive.yaml
http:
  timeout_ms: 4000
upstreams:
  - auth-worker
  - search-indexer

# development settings; keys missing here come from ../../base.yaml
environment: development
region: us-west-2
replicas: 6
log_level: warn
queue:
  name: thrush-development
  batch_size: 50
  visibility_timeout_s: 60
storage:
  include: ../../storage/legacy.yaml
http:
  timeout_ms: 2500
upstreams:
  - inventory-api
  - orders-worker

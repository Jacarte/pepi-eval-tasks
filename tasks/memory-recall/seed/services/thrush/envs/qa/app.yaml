# checkout-worker qa settings; keys missing here come from ../../base.yaml
service: checkout-worker
environment: qa
replicas: 2
log_level: warn
queue:
  name: checkout-worker-qa
  batch_size: 100
  visibility_timeout_s: 30
storage:
  bucket: acme-qa-checkout-worker
  retention_days: 30
http:
  timeout_ms: 2500
upstreams:
  - webhooks-worker
  - cart-api

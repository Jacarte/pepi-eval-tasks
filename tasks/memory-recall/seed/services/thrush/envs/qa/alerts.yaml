# checkout-worker qa alerts
service: checkout-worker
environment: qa
log_retention_days: 14
metrics_retention_days: 60
notify: team-fulfilment
alerts:
  - name: error-rate
    threshold: 0.08
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 400
    for: 10m
    severity: ticket

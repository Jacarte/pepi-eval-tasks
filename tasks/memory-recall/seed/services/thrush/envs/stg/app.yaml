# staging settings; keys missing here come from ../../base.yaml
environment: staging
region: eu-west-2
replicas: 2
log_level: warn
queue:
  name: thrush-staging
  batch_size: 300
  visibility_timeout_s: 60
storage:
  include: ../../storage/short-lived.yaml
http:
  timeout_ms: 2000
upstreams:
  - notifications-worker

# checkout-worker staging settings; keys missing here come from ../../base.yaml
service: checkout-worker
environment: staging
replicas: 5
log_level: info
queue:
  name: checkout-worker-staging
  batch_size: 100
  visibility_timeout_s: 30
storage:
  bucket: acme-staging-checkout-worker
  retention_days: 45
http:
  timeout_ms: 1500
upstreams:
  - profiles-api
  - sms-sender

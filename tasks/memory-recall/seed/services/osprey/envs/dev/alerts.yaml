# billing-legacy development alerts
service: billing-legacy
environment: development
log_retention_days: 120
metrics_retention_days: 365
notify: team-payments
alerts:
  - name: error-rate
    threshold: 0.09
    for: 5m
    severity: page
  - name: latency-p99
    threshold_ms: 600
    for: 10m
    severity: ticket
